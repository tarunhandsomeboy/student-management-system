<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - College Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🎓
            </div>

            <div>
                <h2>StudentMS</h2>
                <span>Management System</span>
            </div>

        </div>


        <nav>

            <a href="index.html" class="nav-item">
                <span>🏠</span>
                Dashboard
            </a>

            <a href="students.html" class="nav-item active">
                <span>👨‍🎓</span>
                Students
            </a>

            <a href="attendance.html" class="nav-item">
                <span>📅</span>
                Attendance
            </a>

            <a href="marks.html" class="nav-item">
                <span>📝</span>
                Marks
            </a>

            <a href="courses.html" class="nav-item">
                <span>📚</span>
                Courses
            </a>

            <a href="faculty.html" class="nav-item">
                <span>👨‍🏫</span>
                Faculty
            </a>

            <a href="reports.html" class="nav-item">
                <span>📊</span>
                Reports
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">

            <div>

                <h1>Students</h1>

                <p>
                    Manage student information
                </p>

            </div>


            <div class="profile">

                <div class="profile-icon">
                    A
                </div>

                <div>

                    <strong>
                        Administrator
                    </strong>

                    <small>
                        Admin
                    </small>

                </div>

            </div>

        </header>


        <!-- ADD STUDENT -->
        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2 id="formTitle">
                        Add New Student
                    </h2>

                    <p>
                        Enter student details below
                    </p>

                </div>

            </div>


            <form id="studentForm">

                <input
                    type="hidden"
                    id="editIndex"
                >


                <div class="form-grid">

                    <!-- STUDENT ID -->

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="STU001"
                            required
                        >

                    </div>


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="studentEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="studentEmail"
                            placeholder="student@email.com"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="studentPhone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="studentPhone"
                            placeholder="9876543210"
                            required
                        >

                    </div>


                    <!-- COURSE -->

                    <div class="form-group">

                        <label for="studentCourse">
                            Course
                        </label>

                        <select
                            id="studentCourse"
                            required
                        >

                            <option value="">
                                Select Course
                            </option>

                            <option value="CSE">
                                Computer Science
                            </option>

                            <option value="ECE">
                                Electronics
                            </option>

                            <option value="EEE">
                                Electrical
                            </option>

                            <option value="MECH">
                                Mechanical
                            </option>

                            <option value="CIVIL">
                                Civil
                            </option>

                        </select>

                    </div>


                    <!-- YEAR -->

                    <div class="form-group">

                        <label for="studentYear">
                            Year
                        </label>

                        <select
                            id="studentYear"
                            required
                        >

                            <option value="">
                                Select Year
                            </option>

                            <option value="1">
                                First Year
                            </option>

                            <option value="2">
                                Second Year
                            </option>

                            <option value="3">
                                Third Year
                            </option>

                            <option value="4">
                                Fourth Year
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn primary"
                    >
                        Save Student
                    </button>


                    <button
                        type="button"
                        class="btn secondary"
                        onclick="resetForm()"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- STUDENT LIST -->

        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>
                        Student List
                    </h2>

                    <p>
                        All registered students
                    </p>

                </div>


                <!-- SEARCH -->

                <div class="search-box">

                    🔍

                    <input
                        type="text"
                        id="searchStudent"
                        placeholder="Search students..."
                    >

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Course
                            </th>

                            <th>
                                Year
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTable">

                        <!-- JavaScript will add students here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- JAVASCRIPT -->

<script src="js/storage.js"></script>

<script src="js/students.js"></script>

</body>

</html>
